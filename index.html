<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pitwall.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Pitwall</title>
    <script>
      // Appearance before first paint (no flash). Mirrors of the shared UI state's
      // `theme` (src/lib/theme.ts; absent/"system" follows macOS), `look` and
      // `reduceMotion` (src/lib/look.ts).
      try {
        var t = localStorage.getItem("pitwall.theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
        // Look and motion (src/lib/look.ts). Glass starts on its "lite" tier
        // (opaque backdrop) until the window's native material is confirmed.
        if (localStorage.getItem("pitwall.look") === "glass" && !matchMedia("(prefers-reduced-transparency: reduce)").matches) {
          document.documentElement.setAttribute("data-look", "glass");
          document.documentElement.setAttribute("data-glass", "lite");
        }
        if (localStorage.getItem("pitwall.motion") === "reduce") document.documentElement.setAttribute("data-motion", "reduce");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

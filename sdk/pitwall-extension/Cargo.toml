# The guest SDK for Pitwall's tiles (docs/spec/tile-sdk/authoring.md §4):
# what an extension's Rust code builds against to make a `tile.wasm` for
# `wasm32-wasip2`. Not part of the app's build: its own workspace (the empty
# [workspace] below), built in CI by the "Tile SDK" job. Its `wit/` is a copy
# of crates/pitwall-tile-host/wit/, kept identical by a test in that crate
# (so the crate is complete when published).
[package]
name = "pitwall-extension"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Write Pitwall tiles in Rust: GPUI-style elements, a Tile trait, typed events and the host APIs of the pitwall:tile@0.1.0 world"
repository = "https://github.com/pitwalls/pitwall"
keywords = ["pitwall", "wasm", "component", "tile", "extension"]
categories = ["wasm", "gui"]
include = ["src/**", "wit/**", "skills/**", "README.md", "Cargo.toml"]

[dependencies]
# The WIT glue (an internal detail: authors never see its types). Only the
# bindings macro and the allocator hook: no async runtime.
wit-bindgen = { version = "=0.63.0", default-features = false, features = ["macros", "realloc", "std"] }
# Content given to a view and saved state are JSON.
serde = "1"
serde_json = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }

[workspace]

[package]
name = "pitwall"
version = "0.1.1"
description = "Pitwall: a pit wall for your coding agents"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pitwall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2.5.1"
tauri-plugin-dialog = "2"
pitwall-core = { path = "../crates/pitwall-core" }
pitwall-providers = { path = "../crates/pitwall-providers" }
pitwall-daemon = { path = "../crates/pitwall-daemon" }
pitwall-proto = { path = "../crates/pitwall-proto" }

[target.'cfg(target_os = "macos")'.dependencies]
# "Reduce transparency" / "Increase contrast" for the Glass look (already in
# the tree through tao and window-vibrancy).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibility", "NSWorkspace"] }

[target.'cfg(windows)'.dependencies]
# The tray icon (the way back to a hidden window; there is no Dock).
tauri = { version = "2", features = ["tray-icon"] }


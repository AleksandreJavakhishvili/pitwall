# Qwen Code. Status comes from screen rules (detect/qwen.toml).
#
# Not installed on the machine this was written on: fields come from Herdr's
# integration (it resumes with `qwen --resume <id>`) and Qwen Code's public
# docs, not from `qwen --help`.
id = "qwen"
name = "Qwen Code"
command = "qwen"
new_args = []
# Unverified flag; session ids are created by Qwen Code.
resume_args = ["--resume", "{session_id}"]
assign_session_id = false
hooks = "none"
rulesync_target = "qwencode"

[package]
name = "pitwall-cli"
version = "0.1.0"
edition = "2021"
description = "The `pitwall` command-line tool (architecture.md §1): lets you and agents add agents and sessions to Pitwall from a terminal. JSON output by default. Shipped inside the app as `pitwall-cli` and linked as `pitwall` (Settings → Install command-line tool)."

[[bin]]
name = "pitwall-cli"
path = "src/main.rs"

[dependencies]
pitwall-client = { path = "../pitwall-client" }
pitwall-proto = { path = "../pitwall-proto" }
clap = { version = "4", features = ["derive"] }
serde = "1"
serde_json = "1"

[dev-dependencies]
pitwall-core = { path = "../pitwall-core", features = ["testing"] }
pitwall-daemon = { path = "../pitwall-daemon" }

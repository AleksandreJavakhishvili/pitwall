[package]
name = "pitwall-cli"
version = "0.8.0"
edition = "2021"
description = "The `pitwall` command-line tool (architecture.md §1): lets you and agents add agents and sessions to Pitwall from a terminal. JSON output by default. Shipped inside the app as `pitwall-cli` and linked as `pitwall` (Settings → Install command-line tool)."

[[bin]]
name = "pitwall-cli"
path = "src/main.rs"

[dependencies]
pitwall-client = { path = "../pitwall-client" }
# `pitwall extension check|test|new`, on a folder without the app; already
# in the tree through pitwall-peer.
pitwall-core = { path = "../pitwall-core" }
# `pitwall peers` (tailnet-peers.md), on the data folder directly.
pitwall-peer = { path = "../pitwall-peer" }
pitwall-proto = { path = "../pitwall-proto" }
clap = { version = "4", features = ["derive"] }
# `pitwall extension check` on a tile: a component's imports and exports
# (component model only; the tile runtime isn't linked). Already in the
# tree through wasmtime.
wasmparser = { version = "0.254", default-features = false, features = ["std", "component-model"] }
# `pitwall extension dev` rebuilds on save; already in the tree through
# pitwall-core.
notify = "8"
serde = "1"
serde_json = "1"
# `pitwall extension sign` (docs/spec/tile-sdk/packaging.md §6.2): a .pwtile
# signed with the author's minisign key, in minisign's own format (MIT; its
# scrypt, ct-codecs, getrandom and rpassword are MIT and/or Apache-2.0).
minisign = "0.10"

[dev-dependencies]
# Its WORLDS and limits, which `pitwall extension check` copies.
pitwall-tile-host = { path = "../pitwall-tile-host" }
pitwall-core = { path = "../pitwall-core", features = ["testing"] }
pitwall-daemon = { path = "../pitwall-daemon" }

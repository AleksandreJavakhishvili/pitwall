[package]
name = "pitwall-app"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
description = "Pitwall's native app (GPUI): hosts pitwall-core's Engine in-process, like src-tauri, and draws the UI with GPUI. Replaces the Tauri app once it reaches feature parity (docs/spec/gpui/README.md)."

[[bin]]
name = "pitwall-app"
path = "src/main.rs"

[features]
# Compile GPUI's Metal shaders when the app starts instead of at build time:
# builds need no Metal toolchain (Xcode 26 ships it as a separate download).
# Release bundles turn it off (`--no-default-features`) for precompiled
# shaders (docs/spec/gpui/packaging.md).
default = ["runtime-shaders"]
runtime-shaders = ["gpui/runtime_shaders"]

[dependencies]
# Zed's UI framework, Apache-2.0. Pinned exactly: GPUI's API changes between
# releases (docs/spec/gpui/README.md "Version and licensing"). Only `gpui`
# itself: Zed's other crates (terminal, editor, ui, workspace, …) are GPL-3.0.
gpui = "=0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The engine-to-UI event channel (MIT OR Apache-2.0; already in the tree via gpui).
futures = "0.3"
# Name rules of the New-agent form (MIT OR Apache-2.0; already in the tree via pitwall-core).
regex = "1"
pitwall-core = { path = "../pitwall-core" }
pitwall-providers = { path = "../pitwall-providers" }
pitwall-daemon = { path = "../pitwall-daemon" }
pitwall-proto = { path = "../pitwall-proto" }
pitwall-client = { path = "../pitwall-client" }
# The native window handle: Glass material (settings/native.rs) and Win32
# calls on gpui's windows (src/platform/). MIT OR Apache-2.0 OR Zlib; already
# in the tree via gpui.
raw-window-handle = "0.6"
# System notifications, as tauri-plugin-notification sends them
# (MIT OR Apache-2.0; already in the tree via the Tauri app).
notify-rust = "4.11"

# macOS: Liquid Glass (NSGlassEffectView), the window appearance and the
# accessibility options (Settings → Appearance); Dock badge, attention bounce
# and About panel (platform). MIT (objc2-app-kit: Zlib OR Apache-2.0 OR MIT);
# already in the tree.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSAccessibility", "NSAppearance", "NSApplication", "NSDockTile", "NSGlassEffectView", "NSGraphics", "NSResponder", "NSRunningApplication", "NSView", "NSWindow", "NSWorkspace"] }

[target.'cfg(windows)'.dependencies]
# Settings → Appearance: Mica and Reduce motion. MIT OR Apache-2.0.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }
# Tray icon and its menu (MIT OR Apache-2.0; already in the tree via Tauri).
tray-icon = { version = "0.25", default-features = false }
# Decoding the tray's PNG icon (MIT OR Apache-2.0; already in the tree via gpui).
image = { version = "0.25", default-features = false, features = ["png"] }
# Taskbar overlay badge, FlashWindowEx, hiding to the tray (MIT OR
# Apache-2.0; the version gpui uses).
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The launcher badge over D-Bus (MIT; already in the tree via notify-rust).
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }
pitwall-core = { path = "../pitwall-core", features = ["testing"] }

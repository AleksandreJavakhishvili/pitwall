# Checks a pull request to the extensions index (marketplace.md §7.2).
# Runs with a read-only token and no secrets: the pull request's files are
# read, its packages downloaded, checked and loaded headless in Pitwall's
# tile runtime, never run as programs. The result is the job's summary
# and an artifact the auto-merge workflow reads.
name: check
on:
  pull_request:
    paths: ["extensions/**", "authors/**", "maintainers.toml", "categories.toml", "blocked.toml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: The pull request
        uses: actions/checkout@v4
        with: { path: head, persist-credentials: false }
      - name: Its base
        uses: actions/checkout@v4
        with: { ref: "${{ github.event.pull_request.base.sha }}", path: base, persist-credentials: false }
      - name: The tool, from Pitwall at a pinned commit
        run: cargo install --locked --git https://github.com/pitwalls/pitwall --rev PITWALL_COMMIT pitwall-index
      - name: Check
        env:
          LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          set +e
          pitwall-index check head --base base --login "$LOGIN" \
            --previous base/dist/v1/index.json --output result.txt > report.md
          status=$?
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          echo "pr=${{ github.event.pull_request.number }}" >> result.txt
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-result
          path: |
            result.txt
            report.md

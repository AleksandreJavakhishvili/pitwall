[package]
name = "pitwall-proto"
version = "0.1.1"
edition = "2021"
description = "The Pitwall wire contract (architecture.md §1, §4): framing, the versioned handshake, request/response/event messages, method names, and the shapes that cross it (AgentView, sessions, approvals). Serde only, no sockets; TypeScript types for the UI are generated from it (src/gen)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-json-impl"] }

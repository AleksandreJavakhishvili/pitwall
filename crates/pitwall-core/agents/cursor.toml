# Cursor Agent CLI. Status comes from screen rules (detect/cursor.toml).
#
# Verified with `cursor-agent --help` (2025.09.18-7ae6800): the command and
# `--resume [chatId]`. There is no flag to choose a chat id up front
# (`create-chat` makes one in a separate run), so none is assigned.
id = "cursor"
name = "Cursor Agent"
command = "cursor-agent"
new_args = []
resume_args = ["--resume", "{session_id}"]
assign_session_id = false
hooks = "none"
rulesync_target = "cursor"
# The logo shown before its name (docs/reference/agents.md).
icon = "cursor"
# No launch-time way to add an MCP server (`cursor-agent --help` 2025.09.18,
# cursor.com/docs/cli): Pitwall adds its `pitwall` server to
# ~/.cursor/mcp.json only when the user asks (Settings → Agents,
# `pitwall-cli show-files add cursor`). Global servers load without asking;
# each tool call still asks unless the user allows `Mcp(pitwall:*)`.
[mcp_file]
path = "~/.cursor/mcp.json"
entry = { type = "stdio" }

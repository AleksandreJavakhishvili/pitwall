# Claude Code. Status comes from hooks passed per launch with --settings,
# so the user's ~/.claude/settings.json is never modified.
id = "claude"
name = "Claude Code"
command = "claude"
# {session_id} is a UUID Pitwall picks up front, so resume works without a hook.
new_args = ["--session-id", "{session_id}"]
resume_args = ["--resume", "{session_id}"]
assign_session_id = true
hooks = "claude-settings"
# rulesync target used when applying rules (docs/spec/rules.md).
rulesync_target = "claudecode"
# `claude --worktree [name]` (-w): Claude creates and enters its own worktree.
worktree_args = ["--worktree", "{name}"]
# Where Claude makes worktrees (its own --worktree and sub-agents), relative to
# the folder it works in; shown under the agent in Pitwall.
worktree_dirs = [".claude/worktrees"]
# What other platforms call it (agw's harness integration), for adopting their sessions.
aliases = ["claude-code"]
# Accounts: each login lives in its own folder (Settings → Agents → Accounts).
account_env = "CLAUDE_CONFIG_DIR"
account_home = "~/.claude"
# The logo shown before its name (docs/reference/agents.md).
icon = "claude"
# Pitwall updates Claude Code itself, one update at a time, and turns off the
# self-update of every session it starts: many sessions updating at once race
# and can leave the `claude` command gone (Settings → Agents).
update_command = "claude update"
update_off_env = { DISABLE_AUTOUPDATER = "1" }

# Sharing (docs/spec/collaboration/sessions.md §6.7): what a shared session's
# sandbox lets it reach. Hosts: the API and the login's token refresh
# (only api.anthropic.com checked so far; the others are unverified).
[share]
model_hosts = ["api.anthropic.com", "console.anthropic.com", "platform.claude.com", "claude.ai"]
# The native installer, the old local install, and npm's global folders.
install_paths = [
    "~/.local/share/claude",
    "~/.claude/local",
    "/opt/homebrew/lib/node_modules/@anthropic-ai/claude-code",
    "/usr/local/lib/node_modules/@anthropic-ai/claude-code",
]
programs = ["node"]
# A subscription login lives in the macOS Keychain (unverified per account).
keychain = true

# Gemini CLI. No per-launch hook mechanism, so status comes from the screen
# rules in detect/gemini.toml (falling back to output activity).
#
# Not installed on the machine this was written on: fields come from Herdr's
# integration and Gemini CLI's public docs, not from `gemini --help`.
id = "gemini"
name = "Gemini CLI"
command = "gemini"
new_args = []
# Unverified: recent Gemini CLI versions accept a session id (as well as
# "latest" or an index) for `--resume`. Ids are created by Gemini.
resume_args = ["--resume", "{session_id}"]
assign_session_id = false
hooks = "none"
# The logo shown before its name (docs/reference/agents.md).
icon = "gemini"
# No rulesync target for Gemini CLI in rulesync 27 (Gemini reads GEMINI.md;
# rulesync only covers the Antigravity products), so none is set, and
# Pitwall writes the rules itself (docs/spec/rules.md): into GEMINI.md,
# which Gemini CLI reads from its working folder, unless the project has its
# own; then into a file of Pitwall's that each fresh start asks Gemini to
# read first (`--prompt-interactive`: run this prompt, then stay interactive;
# unverified, like the rest of this file).
[rules_fallback]
target = "geminicli"
file = "GEMINI.md"
alt_file = ".gemini/pitwall-rules.md"
alt_args = ["--prompt-interactive", "Read {file} first: it holds the rules for working in this project. Follow them, then wait for my request."]

# Gemini CLI. No per-launch hook mechanism, so status comes from the screen
# rules in detect/gemini.toml (falling back to output activity).
#
# Not installed on the machine this was written on: fields come from Herdr's
# integration and Gemini CLI's public docs, not from `gemini --help`.
id = "gemini"
name = "Gemini CLI"
command = "gemini"
new_args = []
# Unverified: recent Gemini CLI versions accept a session id (as well as
# "latest" or an index) for `--resume`. Ids are created by Gemini.
resume_args = ["--resume", "{session_id}"]
assign_session_id = false
hooks = "none"
# No rulesync target for Gemini CLI in rulesync 27 (Gemini reads GEMINI.md;
# rulesync only covers the Antigravity products), so none is set.
# The logo shown before its name (docs/reference/agents.md).
icon = "gemini"

# Sharing (docs/spec/collaboration/sessions.md §6.7). Hosts from Gemini CLI's
# docs (unverified: not installed here).
[share]
# Its login lives in ~/.gemini with no variable to move it, so a session's own
# HOME has no login, and ~/.gemini is never mounted or copied. A share goes
# live only with an API key the owner passes explicitly (§6.3).
login_dir = "~/.gemini"
# GOOGLE_API_KEY alone isn't enough: it's for Vertex AI with more settings.
api_key_env = ["GEMINI_API_KEY"]
model_hosts = [
    "generativelanguage.googleapis.com",
    "cloudcode-pa.googleapis.com",
    "oauth2.googleapis.com",
    "www.googleapis.com",
]
install_paths = [
    "/opt/homebrew/lib/node_modules/@google/gemini-cli",
    "/usr/local/lib/node_modules/@google/gemini-cli",
    "/opt/homebrew/Cellar/gemini-cli",
]
programs = ["node"]
# Each turn runs in its non-interactive mode (below); the reply is the JSON's
# `response`.
reply = "non-interactive"
instruction_files = ["GEMINI.md"]
# Its own sandbox (Seatbelt on macOS) can't nest inside Pitwall's.
own_sandbox_off_env = { GEMINI_SANDBOX = "false" }
# Each conversation's copy is a new folder: trusted for the run, or headless
# mode refuses to start ("not running in a trusted directory").
session_args = ["--skip-trust"]

# `gemini -p … --output-format json`: one turn per run, resumed by id. Checked
# with Gemini CLI 0.64.0 against a local mock of the model API: `--session-id`
# starts a conversation with Pitwall's id, `--resume <id>` with `-p` continues
# it (the history goes with the request), the reply is `response`, and a
# failed run prints `{"session_id", "error": {"message", …}}` on stderr.
[share.non_interactive]
first_args = ["--session-id", "{session_id}", "-p", "{message}", "--output-format", "json"]
next_args = ["--resume", "{session_id}", "-p", "{message}", "--output-format", "json"]
reply = "/response"
session_id = "/session_id"
error = "/error/message"

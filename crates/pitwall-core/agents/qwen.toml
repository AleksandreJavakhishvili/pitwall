# Qwen Code. Status comes from screen rules (detect/qwen.toml).
#
# Not installed on the machine this was written on: fields come from Herdr's
# integration (it resumes with `qwen --resume <id>`) and Qwen Code's public
# docs, not from `qwen --help`.
id = "qwen"
name = "Qwen Code"
command = "qwen"
new_args = []
# Unverified flag; session ids are created by Qwen Code.
resume_args = ["--resume", "{session_id}"]
assign_session_id = false
hooks = "none"
# Pitwall's `pitwall` MCP server (agents.showFiles): `--mcp-config '<json>'`
# per launch, merged with the user's and the project's servers, and
# `--allowed-tools` for its tools (Qwen Code's top-level options and
# mcpServers.ts; from docs and source, not run).
mcp = "qwen-config"
rulesync_target = "qwencode"
# The logo shown before its name (docs/reference/agents.md).
icon = "qwen"

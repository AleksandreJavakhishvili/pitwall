[package]
name = "pitwall-core"
version = "0.2.1"
edition = "2021"
description = "Pitwall's logic: the Engine (agents, status, queue, tasks), kinds and launch planning, git/review, rules, onboarding. No UI framework: the host plugs in through narrow traits (EventSink, Clock, Store). architecture.md §1."

[features]
# Test doubles (`testing::{RecordingSink, ManualClock, MemStore, FakeExec,
# FakeProvider}`), the provider contract suite (`testing::contract`) and the
# Fake network (`net::fake`) for hosts' and providers' tests.
testing = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.27.0", features = ["v4"] }
toml = "1.1.6"
# File-change notifications for checkouts on this machine
# (`exec::LocalExec::watch`): agents' changes are refreshed when their files
# change instead of being polled.
notify = "8"
# Match ranges for git grep results (explorer search); already in the tree via pitwall-detect.
regex = "1"
# Request and response types of the collaboration handler and clients
# (`net`, docs/spec/collaboration/network.md); already in the tree via gpui.
http = "1"
# The Tailscale network backend (`net::tailscale`, network.md §15.5): the
# client side of collaboration's HTTP. Plain HTTP only (WireGuard encrypts),
# so no TLS features. Pinned exactly: the backend plugs its own connector
# into ureq's `unversioned` transport API.
ureq = { version = "=3.4.0", default-features = false }
# Request heads on the backend's own HTTP/1.1 listener (it authenticates a
# connection with `whois` before reading a byte, which tiny_http can't do).
httparse = "1"
# The instance key (`net::InstanceKey`, tailnet-peers.md §5): Ed25519 to
# sign team records, seeded from the OS's random source.
ed25519-dalek = "2"
getrandom = "0.3"
base64 = "0.22"
# Collaboration (docs/spec/collaboration/): team records are hashed
# (SHA-256) and signed (Ed25519, above) per §4.2; daily limits reset at the
# owner's local midnight (§5.8). sha2 and chrono are already in the tree.
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
pitwall-detect = { path = "../pitwall-detect" }
pitwall-proto = { path = "../pitwall-proto" }

[target.'cfg(windows)'.dependencies]
# Local sockets as named pipes (hooks, the CLI socket), per-user only.
interprocess = "2"
widestring = "1"
windows-sys = { version = "0.61", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

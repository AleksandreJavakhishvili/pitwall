[package]
name = "pitwall-core"
version = "0.8.0"
edition = "2021"
description = "Pitwall's logic: the Engine (agents, status, queue, tasks), kinds and launch planning, git/review, rules, onboarding. No UI framework: the host plugs in through narrow traits (EventSink, Clock, Store). architecture.md §1."

[features]
# Test doubles (`testing::{RecordingSink, ManualClock, MemStore, FakeExec,
# FakeProvider}`) and the provider contract suite (`testing::contract`) for
# hosts' and providers' tests; throwaway minisign keys that sign tile
# packages (`testing::Signing`).
testing = ["dep:minisign"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.27.0", features = ["v4"] }
toml = "1.1.6"
# File-change notifications for checkouts on this machine
# (`exec::LocalExec::watch`): agents' changes are refreshed when their files
# change instead of being polled.
notify = "8"
# Match ranges for git grep results (explorer search); already in the tree via pitwall-detect.
regex = "1"
# Unified diffs of library rules against projects' copies (rules::project); already in the tree via the app.
similar = "2"
# Extensions from an npm package (extensions::npm): the tarball's sha512
# integrity (sha2), its base64 (base64) and its gzip (flate2); all pure
# Rust, MIT OR Apache-2.0, already in the tree. The https requests are the
# host's (`npm::Http`; the app's uses ureq), so this crate builds no C.
sha2 = "0.10"
flate2 = "1"
base64 = "0.22"
# Tile packages' signatures (extensions::package, docs/spec/tile-sdk/
# packaging.md §6.2): minisign verification only; MIT, no dependencies of
# its own. Signing is the CLI's; here only for tests (`testing`).
minisign-verify = "0.3"
minisign = { version = "0.10", optional = true }
pitwall-detect = { path = "../pitwall-detect" }
pitwall-proto = { path = "../pitwall-proto" }

[dev-dependencies]
# Throwaway keys that sign packages in tests (MIT).
minisign = "0.10"

[target.'cfg(unix)'.dependencies]
# An adapter's process group stopped as one (platform/group.rs); already in
# the tree.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Local sockets as named pipes (hooks, the CLI socket), per-user only.
interprocess = "2"
widestring = "1"
windows-sys = { version = "0.61", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

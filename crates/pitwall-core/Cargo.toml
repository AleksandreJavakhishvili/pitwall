[package]
name = "pitwall-core"
version = "0.1.1"
edition = "2021"
description = "Pitwall's logic: the Engine (agents, status, queue, tasks), kinds and launch planning, git/review, rules, onboarding. No UI framework: the host plugs in through narrow traits (EventSink, Clock, Store). architecture.md §1."

[features]
# Test doubles (`testing::{RecordingSink, ManualClock, MemStore, FakeExec,
# FakeProvider}`) and the provider contract suite (`testing::contract`) for
# hosts' and providers' tests.
testing = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.27.0", features = ["v4"] }
toml = "1.1.6"
# File-change notifications for checkouts on this machine
# (`exec::LocalExec::watch`): agents' changes are refreshed when their files
# change instead of being polled.
notify = "8"
# Match ranges for git grep results (explorer search); already in the tree via pitwall-detect.
regex = "1"
pitwall-detect = { path = "../pitwall-detect" }
pitwall-proto = { path = "../pitwall-proto" }

[target.'cfg(windows)'.dependencies]
# Local sockets as named pipes (hooks, the CLI socket), per-user only.
interprocess = "2"
widestring = "1"
windows-sys = { version = "0.61", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

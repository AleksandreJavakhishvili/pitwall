# Pitwall screen-detection rules for Claude Code.
#
# Adapted from Herdr's claude manifest (src/detect/manifests/claude.toml,
# version 2026.09.11.1), https://github.com/herdrdev/herdr
# Copyright the Herdr authors (herdrdev). Licensed under the Apache
# License, Version 2.0. Modified for Pitwall: rule engine schema simplified,
# whole-screen regions narrowed to the bottom of the screen, OSC progress
# rule dropped, trust-folder rule and detail hints added. See NOTICE.
#
# Validated against Claude Code v2.1.280 screens captured in a PTY.
# Rules are evaluated by descending priority; the first match wins.
# A user file at ~/.pitwall/detect/claude.toml replaces this file.

id = "claude"
version = "2026.10.06"

# Hint shown for blocked states: first pattern (in order) found near the
# bottom of the screen, searching bottom-up; capture group 1 if present.
detail_line = [
  '(?i)^\s*(do you want to [^\n]*\?)\s*$',
  '(?i)^\s*(would you like to [^\n]*\?)\s*$',
  '(?i)^\s*(MCP server .* requests your input)\s*$',
  # A question line that is not a numbered option or a prompt echo.
  '^\s*([^\s❯⏺⎿\d][^\n]*\?)\s*$',
]

# --- Title (set by Claude itself; cannot be typed by the user) -------------

[[rules]]
id = "osc_title_working"
state = "working"
priority = 1100
region = "title"
# Braille covers <= 2.1.227; half-circles are the 2.1.228+ busy spinner.
regex = ['^[\x{2800}-\x{28FF}\x{25D0}-\x{25D3}] ']

# --- Overlays that say nothing about the agent's state ---------------------

[[rules]]
id = "transcript_viewer"
state = "unknown"
priority = 1000
region = "bottom_non_empty_lines(3)"
contains = ["showing detailed transcript"]
any = [
  { contains = ["ctrl+o", "to toggle"] },
  { contains = ["ctrl+e", "show all"] },
  { contains = ["ctrl+e", "collapse"] },
  { contains = ["↑↓ scroll"] },
  { contains = ["? for shortcuts"] },
]

# --- Blocking dialogs ------------------------------------------------------

[[rules]]
id = "trust_folder"
state = "blocked"
priority = 990
region = "after_last_horizontal_rule"
detail = "Trust this folder?"
contains = ["i trust this folder", "esc to cancel"]

[[rules]]
id = "live_blocked_form"
state = "blocked"
priority = 980
region = "after_last_horizontal_rule"
contains = ["esc to cancel"]
any = [
  { contains = ["enter to confirm"] },
  { contains = ["enter to select"], any = [
    { contains = ["tab/arrow keys to navigate"] },
    { contains = ["arrow keys to navigate"] },
    { contains = ["arrows to navigate"] },
    { contains = ["↑/↓ to navigate"] },
    { contains = ["↑↓ to navigate"] },
  ] },
]

[[rules]]
id = "dynamic_workflow_prompt"
state = "blocked"
priority = 980
region = "bottom_non_empty_lines(20)"
contains = ["run a dynamic workflow?", "esc to cancel"]

[[rules]]
id = "mcp_elicitation_prompt"
state = "blocked"
priority = 980
region = "bottom_non_empty_lines(30)"
# MCP elicitation dialogs show Accept/Decline controls with an "Esc to
# cancel" footer but no Enter hint.
contains = ["esc to cancel"]
line_regex = ['(?i)^\s*MCP server ["\x{201C}].+["\x{201D}] requests your input\s*$']
any = [
  { line_regex = ['^\s*\x{276F}?\s*Accept\b'] },
  { line_regex = ['^\s*\x{276F}?\s*Decline\b'] },
]

# --- Working ---------------------------------------------------------------

[[rules]]
id = "btw_overlay_working"
state = "working"
priority = 975
region = "bottom_non_empty_lines(5)"
line_regex = [
  '^\s*/btw(?:\s|$)',
  '(?i)esc to close\s*$',
]

[[rules]]
id = "footer_esc_to_interrupt"
state = "working"
priority = 970
# The status footer below the prompt box, e.g.
#   ⏸ manual mode on · esc to interrupt · ← for agents
# Text typed into the prompt box sits above the last rule, so it can't match.
region = "after_last_horizontal_rule"
line_regex = ['(?i)(?:^\s*[⏸⏵]|·)[^\n]*esc to interrupt(?:\s|·|$)']

[[rules]]
id = "spinner_line_working"
state = "working"
priority = 970
# The live spinner line just above the prompt box, at column 0, e.g.
#   ✶ Symbioting…            · Working… (2s · ↓ 23 tokens)
# Agent output is indented and user prompts start with ❯, so neither matches.
region = "above_prompt_box_bottom(6)"
line_regex = ['^[\x{002A}\x{00B7}\x{2722}\x{2733}\x{2736}\x{273B}\x{273D}]\s+\S.*…(?:\s+\(\d+[smh](?:\s|·)|\s*$)']

[[rules]]
id = "background_agents_working"
state = "working"
priority = 965
region = "last_non_empty_above_prompt_box"
line_regex = ['^\s*[\x{002A}\x{00B7}\x{2722}\x{2736}\x{273B}\x{273D}]\s+Waiting for [1-9]\d* background agents? to finish\s*$']

[[rules]]
id = "background_mcp_task_working"
state = "working"
priority = 965
region = "bottom_non_empty_lines(12)"
# Activity summaries render at column zero; wrapped continuations are indented.
regex = ['(?m)^[\x{002A}\x{00B7}\x{2722}\x{2736}\x{273B}\x{273D}][ \t]+\S[^\n]*?(?:\n[ \t]+[^\n]*?){0,3}·(?:[ \t]+|\n[ \t]*)[1-9]\d*(?:[ \t]+|\n[ \t]*)MCP(?:[ \t]+|\n[ \t]*)tasks?(?:[ \t]+|\n[ \t]*)still(?:[ \t]+|\n[ \t]*)running[ \t]*$']
not = [
  { contains = ["do you want to proceed?"] },
  { contains = ["esc to cancel"] },
  { contains = ["waiting for permission"] },
  { contains = ["do you want to allow this connection?"] },
  { contains = ["tab to amend"] },
  { contains = ["ctrl+e to explain"] },
]

# --- Idle: the empty/typed prompt box --------------------------------------

[[rules]]
id = "live_prompt_box"
state = "idle"
priority = 950
region = "prompt_box_body"
line_regex = ['^\s*❯']
not = [
  { contains = ["enter to select"] },
  { contains = ["esc to cancel"] },
  { contains = ["tab/arrow keys"] },
  { contains = ["arrow keys to navigate"] },
  { contains = ["↑/↓ to navigate"] },
]

[[rules]]
id = "model_picker_menu"
state = "unknown"
priority = 900
region = "bottom_non_empty_lines(25)"
contains = ["select model", "enter to set as default", "esc to cancel"]
not = [
  { contains = ["do you want to proceed?"] },
  { contains = ["enter to select"] },
]

# --- Permission prompts (no prompt box is shown while these are up) --------

[[rules]]
id = "bash_permission_prompt"
state = "blocked"
priority = 850
region = "bottom_non_empty_lines(30)"
contains = ["do you want to proceed?"]
any = [
  { contains = ["bash command"] },
  { contains = ["bash("] },
  { contains = ["contains expansion"] },
  { contains = ["tab to amend"] },
  { contains = ["ctrl+e to explain"] },
]
# The selected option carries a "❯" prefix.
all = [
  { any = [
    { line_regex = ['(?i)^\s*❯?\s*yes\b'] },
    { line_regex = ['(?i)^\s*❯?\s*1\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*❯?\s*2\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*❯?\s*2\.\s*no\b'] },
    { line_regex = ['(?i)^\s*❯?\s*3\.\s*no\b'] },
  ] },
]

[[rules]]
id = "generic_permission_prompt"
state = "blocked"
priority = 840
region = "after_last_horizontal_rule"
contains = ["do you want to proceed?", "esc to cancel"]
any = [
  { line_regex = ['(?i)^\s*❯?\s*1\.\s*yes\b'] },
  { line_regex = ['(?i)^\s*❯?\s*2\.\s*yes\b'] },
  { line_regex = ['(?i)^\s*❯?\s*2\.\s*no\b'] },
  { line_regex = ['(?i)^\s*❯?\s*3\.\s*no\b'] },
]

[[rules]]
id = "legacy_no_prompt_blocker"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(20)"
any = [
  { contains = ["do you want to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
  { contains = ["would you like to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
  { contains = ["waiting for permission"] },
  { contains = ["do you want to allow this connection?"] },
  { contains = ["tab to amend"] },
  { contains = ["ctrl+e to explain"] },
  { contains = ["do you want to proceed?", "esc to cancel"] },
  { contains = ["review your answers"] },
  { contains = ["skip interview and plan immediately"] },
]
# An empty live prompt line means the prompt box is up, i.e. not blocked.
not = [
  { regex = ['(?m)^\s*❯\s*$'] },
]

# --- Fallback: idle title --------------------------------------------------

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 250
region = "title"
regex = ['^\x{2733} ']

# Pitwall screen-detection rules for Amp.
#
# Adapted from Herdr's amp manifest (src/detect/manifests/amp.toml,
# version 2026.07.09.1), https://github.com/herdrdev/herdr
# Copyright the Herdr authors (herdrdev). Licensed under the Apache
# License, Version 2.0. Modified for Pitwall: rule engine schema simplified,
# whole-screen regions narrowed to the bottom of the screen, detail hints
# and an explicit idle fallback (Herdr's engine default) added. See NOTICE.
#
# Not validated against captured screens yet (Amp was not installed when
# this was written); tests use screens built from Herdr's rule strings.
# Rules are evaluated by descending priority; the first match wins.
# A user file at ~/.pitwall/detect/amp.toml replaces this file.

id = "amp"
version = "2026.10.06"

detail_line = [
  '(?i)^[\s│╭╰]*((?:run this command|allow editing file|allow creating file|invoke tool|confirm tool call)[^│\n]*?)[\s│]*$',
  '^[\s│]*([^\s│>\d][^│\n]*\?)[\s│]*$',
]

# --- Title (set by Amp itself) ---------------------------------------------

[[rules]]
id = "osc_title_plugin_confirmation_blocked"
state = "blocked"
priority = 1100
region = "title"
detail = "Plugin confirmation needed"
contains = ["Plugin confirmation needed"]

[[rules]]
id = "osc_title_working"
state = "working"
priority = 1050
region = "title"
regex = ['^[\x{2800}-\x{28FF}] ']

# --- Approval prompts ------------------------------------------------------

[[rules]]
id = "approval_footer"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(20)"
any = [
  { contains = ["waiting for approval"] },
  { contains = ["invoke tool"] },
  { contains = ["run this command?"] },
  { contains = ["allow editing file:"] },
  { contains = ["allow creating file:"] },
  { contains = ["confirm tool call"] },
  { contains = ["approve"], any = [{ contains = ["allow all for this session"] }, { contains = ["allow all for every session"] }, { contains = ["allow file for every session"] }, { contains = ["deny with feedback"] }] },
]

# --- Working ---------------------------------------------------------------

[[rules]]
id = "status_footer_working"
state = "working"
priority = 200
region = "bottom_non_empty_lines(5)"
line_regex = ['(?i)^\s*╰\s+\S+\s+(thinking|streaming|running tools|waiting)\s+─']

[[rules]]
id = "esc_cancel_working"
state = "working"
priority = 100
region = "bottom_non_empty_lines(8)"
contains = ["esc to cancel"]

# --- Idle ------------------------------------------------------------------

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 50
region = "title"
contains = [" - amp - "]
not = [
  { regex = ['^[\x{2800}-\x{28FF}] '] },
  { contains = ["Plugin confirmation needed"] },
]

[[rules]]
id = "known_agent_idle_fallback"
state = "idle"
priority = 0
# Herdr treats a recognised agent with no working/blocked evidence as idle.
region = "bottom_non_empty_lines(1)"
regex = ['\S']

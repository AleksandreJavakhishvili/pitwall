# Pitwall screen-detection rules for the Gemini CLI.
#
# Adapted from Herdr's gemini manifest (src/detect/manifests/gemini.toml,
# version 2026.06.10.1), https://github.com/herdrdev/herdr
# Copyright the Herdr authors (herdrdev). Licensed under the Apache
# License, Version 2.0. Modified for Pitwall: rule engine schema simplified,
# whole-screen regions narrowed to the bottom of the screen, detail hints
# and an explicit idle fallback (Herdr's engine default) added. See NOTICE.
#
# Not validated against captured screens yet (Gemini CLI was not installed
# when this was written); tests use screens built from Herdr's rule strings.
# Rules are evaluated by descending priority; the first match wins.
# A user file at ~/.pitwall/detect/gemini.toml replaces this file.

id = "gemini"
version = "2026.10.06"

detail_line = [
  # Question lines inside Gemini's bordered dialogs ("│ Apply this change? │").
  '(?i)^[\s│]*((?:apply this change|allow execution|do you want to proceed)[^│\n]*\?)',
  '^[\s│]*([^\s│●○❯>\d][^│\n]*\?)[\s│]*$',
]

# --- Confirmation dialogs --------------------------------------------------

[[rules]]
id = "apply_or_allow_change"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(25)"
any = [
  { contains = ["│ Apply this change"] },
  { contains = ["│ Allow execution"] },
  { all = [{ contains = ["yes"] }, { any = [{ contains = ["waiting for user confirmation"] }, { contains = ["│ Do you want to proceed"] }, { contains = ["do you want to proceed?"] }] }] },
  { line_regex = ['(?i)^\s*❯.*(yes|allow)'] },
]

# --- Working ---------------------------------------------------------------

[[rules]]
id = "esc_cancel_working"
state = "working"
priority = 100
# The loading line above the composer: "⠴ Thinking… (esc to cancel, 5s)".
region = "bottom_non_empty_lines(12)"
contains = ["esc to cancel"]

# --- Idle ------------------------------------------------------------------

[[rules]]
id = "known_agent_idle_fallback"
state = "idle"
priority = 0
# Herdr treats a recognised agent with no working/blocked evidence as idle.
region = "bottom_non_empty_lines(1)"
regex = ['\S']

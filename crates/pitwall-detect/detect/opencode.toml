# Pitwall screen-detection rules for opencode.
#
# Adapted from Herdr's opencode manifest (src/detect/manifests/opencode.toml,
# version 2026.06.10.1), https://github.com/herdrdev/herdr
# Copyright the Herdr authors (herdrdev). Licensed under the Apache
# License, Version 2.0. Modified for Pitwall: rule engine schema simplified,
# whole-screen regions narrowed to the bottom of the screen, detail hint and
# an explicit idle fallback (Herdr's engine default) added. See NOTICE.
#
# Not validated against captured screens yet (opencode was not installed
# when this was written); tests use screens built from Herdr's rule strings.
# Rules are evaluated by descending priority; the first match wins.
# A user file at ~/.pitwall/detect/opencode.toml replaces this file.

id = "opencode"
version = "2026.10.06"

# --- Permission / question dialogs -----------------------------------------

[[rules]]
id = "permission_required"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(25)"
detail_line = [
  '△\s*(Permission required)',
  '^[\s┃│]*([^\s┃│][^┃│\n]*\?)[\s┃│]*$',
]
any = [
  { contains = ["△ Permission required"] },
  { contains = ["esc dismiss"], any = [{ contains = ["enter confirm"] }, { contains = ["enter submit"] }, { contains = ["enter toggle"] }], all = [{ any = [{ contains = ["↑↓ select"] }, { contains = ["⇆ tab"] }] }] },
]

# --- Working ---------------------------------------------------------------

[[rules]]
id = "interrupt_hint_working"
state = "working"
priority = 110
# The footer under the input box.
region = "bottom_non_empty_lines(12)"
any = [
  { contains = ["esc to interrupt"] },
  { contains = ["ctrl+c to interrupt"] },
  { contains = ["press esc to interrupt"] },
  { line_regex = ['(?i).*opencode.*esc (again to )?interrupt'] },
]

[[rules]]
id = "progress_bar_working"
state = "working"
priority = 100
# The animated block progress bar next to the footer.
region = "bottom_non_empty_lines(12)"
regex = ['(■|⬝){4,}']

# --- Idle ------------------------------------------------------------------

[[rules]]
id = "known_agent_idle_fallback"
state = "idle"
priority = 0
# Herdr treats a recognised agent with no working/blocked evidence as idle.
region = "bottom_non_empty_lines(1)"
regex = ['\S']

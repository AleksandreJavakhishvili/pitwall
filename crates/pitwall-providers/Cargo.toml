[package]
name = "pitwall-providers"
version = "0.1.0"
edition = "2021"
description = "Places agents run, as pitwall-core Providers (architecture.md §1, §2.7): `local` (this Mac, terminals in pitwall-hold holders) today; agw and ssh next. The only crate that knows about specific places to run; each provider is a cargo feature and passes pitwall-core's provider contract suite."

[features]
default = ["local"]
# This Mac: agents in `pitwall-hold` terminal holders, LocalExec, lsof.
local = ["dep:pitwall-hold"]

[dependencies]
pitwall-core = { path = "../pitwall-core" }
pitwall-hold = { path = "../pitwall-hold", optional = true }

[dev-dependencies]
pitwall-core = { path = "../pitwall-core", features = ["testing"] }

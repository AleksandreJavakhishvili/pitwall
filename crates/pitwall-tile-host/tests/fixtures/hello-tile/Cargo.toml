# The hello tile, the tile host's test fixture, written with the guest SDK
# (sdk/pitwall-extension, WIT 0.1) and built to a WebAssembly component for
# wasm32-wasip2. Its own
# workspace (the empty [workspace] below), so the main workspace and CI
# never need the wasm target. The built component is committed as
# ../hello/tile.wasm, in the hello extension's folder; rebuild it with
# ../build-hello-tile.sh.
[package]
name = "hello-tile"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The guest SDK, from this repository.
pitwall-extension = { path = "../../../../../sdk/pitwall-extension" }
# An agent tool's input.
serde = { version = "1", features = ["derive"] }
regex = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
chrono = { version = "0.4", optional = true }

[features]
# A tile-sized build for compile-time measurements (src/lib.rs `heavy`).
heavy = ["dep:regex", "dep:serde_json", "dep:chrono"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]

# The blocks tile, the test fixture for canvases, drag and drop and the
# code and diff views, written with the guest SDK (sdk/pitwall-extension)
# and built to a WebAssembly component for wasm32-wasip2. Its own workspace
# (the empty [workspace] below), so the main workspace and CI never need
# the wasm target. The built component is committed as ../blocks/tile.wasm;
# rebuild it with ../build-hello-tile.sh.
[package]
name = "blocks-tile"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The guest SDK, from this repository.
pitwall-extension = { path = "../../../../../sdk/pitwall-extension" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]

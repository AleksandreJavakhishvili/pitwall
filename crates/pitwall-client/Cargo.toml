[package]
name = "pitwall-client"
version = "0.1.1"
edition = "2021"
description = "Talks to Pitwall's socket (architecture.md §1, §4): connect, the versioned handshake, typed calls, events. Shared by the `pitwall` CLI and, after the daemon split, the app."

[dependencies]
pitwall-proto = { path = "../pitwall-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
interprocess = "2"

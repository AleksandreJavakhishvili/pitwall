[package]
name = "pitwall-daemon"
version = "0.1.0"
edition = "2021"
description = "Pitwall's socket server (architecture.md §1, §4): the versioned protocol over a local socket, the method table with each method's risk, approvals the user answers in Pitwall's UI, and who is calling (peer process → the agent it runs in). Runs inside the app for now; `pitwalld` (step 6) will host the same server."

[dependencies]
pitwall-core = { path = "../pitwall-core" }
pitwall-proto = { path = "../pitwall-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
pitwall-core = { path = "../pitwall-core", features = ["testing"] }
pitwall-client = { path = "../pitwall-client" }

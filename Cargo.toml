# Cargo workspace (architecture.md §1, migration step 0).
[workspace]
resolver = "2"
# Vendored crates (third_party/zed/README.md) are dependencies, not members:
# their own tests and lints aren't ours to run.
exclude = ["third_party"]
members = ["crates/pitwall-core", "crates/pitwall-detect", "crates/pitwall-hold", "crates/pitwall-providers", "crates/pitwall-proto", "crates/pitwall-client", "crates/pitwall-daemon", "crates/pitwall-peer", "crates/pitwall-cli", "crates/pitwall-hook", "crates/pitwall-app", "crates/pitwall-term-view"]

# Profiles only take effect at the workspace root.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Dependencies (gpui, alacritty_terminal, …) optimized in dev builds too:
# gpui at opt-level 0 can't keep up with 120 Hz scrolling. Our own crates
# stay quick to rebuild.
[profile.dev.package."*"]
opt-level = 2

# Release with line tables, for `sample` / `heap` (docs/spec/perf.md).
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false

# GPUI from Zed's repository (third_party/zed/README.md): not on crates.io
# since 0.2.2, so its crates are vendored, with Pitwall's patches
# (third_party/zed/PATCHES.md).
[patch.crates-io]
gpui = { path = "third_party/zed/gpui" }

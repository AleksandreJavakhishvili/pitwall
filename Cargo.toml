# Cargo workspace (architecture.md §1, migration step 0).
[workspace]
resolver = "2"
members = ["crates/pitwall-core", "crates/pitwall-detect", "crates/pitwall-hold", "crates/pitwall-providers", "crates/pitwall-proto", "crates/pitwall-client", "crates/pitwall-daemon", "crates/pitwall-cli", "crates/pitwall-hook", "crates/pitwall-app", "crates/pitwall-term-view"]

# Profiles only take effect at the workspace root.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Dependencies (gpui, alacritty_terminal, …) optimized in dev builds too:
# gpui at opt-level 0 can't keep up with 120 Hz scrolling. Our own crates
# stay quick to rebuild.
[profile.dev.package."*"]
opt-level = 2

# Release with line tables, for `sample` / `heap` (docs/spec/perf.md).
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false

# GPUI 0.2.2 with a small memory patch to its macOS Metal renderer
# (third_party/gpui/PATCHES.md).
[patch.crates-io]
gpui = { path = "third_party/gpui" }

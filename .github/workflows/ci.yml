name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (test + clippy)
    # The app is macOS-first: PTYs, the terminal holder and the platform layer
    # are tested on the OS they ship on.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the version pinned in rust-toolchain.toml (+ its components/targets).
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # tauri-build needs the frontend dist folder to exist, even for tests.
      - name: Placeholder frontend dist
        run: mkdir -p dist

      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  web:
    name: UI (build + test) and website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: Website build (with the live demo)
        working-directory: website
        run: |
          pnpm install --frozen-lockfile --ignore-workspace
          pnpm build --base /${{ github.event.repository.name }}/

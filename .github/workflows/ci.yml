name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  commits:
    name: Commit messages (Conventional Commits)
    # Pull requests only: the history on main from before the convention
    # stays as it is. Same rules as the commit-msg hook (.githooks/commit-msg,
    # see CONTRIBUTING.md "Commit messages").
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Hook self-test
        run: sh scripts/test-commit-msg.sh

      - name: PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: sh scripts/check-commits.sh --title "$TITLE"

      - name: PR commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: sh scripts/check-commits.sh "$BASE..$HEAD"

  rust:
    name: Rust on macOS (test + clippy)
    # PTYs, the terminal holder and the platform layer are tested on each OS
    # they ship on (rust-linux and rust-windows below).
    runs-on: macos-latest
    # The workspace with GPUI: ~25 min cold, a few warm. A hang fails here
    # instead of running into GitHub's 6-hour limit.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Installs the version pinned in rust-toolchain.toml (+ its components/targets).
      - run: rustup toolchain install

      # Saved even when a step fails: a cold GPUI build is long, and a
      # failing first run shouldn't make the fix-up run start cold again.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # pitwall-app builds with runtime Metal shaders (its default feature),
      # so no Metal toolchain is needed here; release.yml precompiles.
      - name: cargo test
        run: cargo test --workspace --no-fail-fast

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-linux:
    name: Rust on Linux (build + test + clippy)
    # The Linux platform layer (/proc, XDG folders), the holder's forkpty and
    # the app (GPUI on X11/Wayland) are checked on the OS they ship on.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # GPUI's build dependencies for crates/pitwall-app (X11 + Wayland,
      # xkbcommon, fontconfig, Vulkan via blade; the subset of Zed's
      # script/linux that gpui links).
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file pkg-config libssl-dev \
            clang libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan1 libvulkan-dev libzstd-dev libasound2-dev libglib2.0-dev

      # Installs the version pinned in rust-toolchain.toml (+ its components/targets).
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo build
        run: cargo build --workspace --all-targets --target x86_64-unknown-linux-gnu

      - name: cargo test
        run: cargo test --workspace --no-fail-fast --target x86_64-unknown-linux-gnu

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --target x86_64-unknown-linux-gnu -- -D warnings

  rust-windows:
    name: Rust on Windows (build + test + clippy)
    # The Windows port (ConPTY holder, named pipes, pitwall-hook, PowerShell
    # launch, tray, the GPUI app). Build and clippy cover the whole workspace; the suites
    # that are portable must pass. The ones listed under "not yet ported"
    # still assume POSIX shells in their fixtures and run with
    # continue-on-error, one step each so a regression in a passing suite is
    # never hidden behind them.
    runs-on: windows-latest
    # A hang (the ConPTY holder suites) fails here instead of running into
    # GitHub's 6-hour limit and showing up as "cancelled". Room for a cold
    # GPUI build: the per-crate test steps below re-resolve features and
    # rebuild part of the tree.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Installs the version pinned in rust-toolchain.toml (+ its components/targets).
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo build
        run: cargo build --workspace --all-targets

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Holder protocol + the terminal-survives-restart contract (ConPTY,
      # named pipes), the hook relay, wire formats, screen detection.
      - name: cargo test (holder, hook, proto, detect, client)
        run: cargo test -p pitwall-hold -p pitwall-hook -p pitwall-proto -p pitwall-detect -p pitwall-client

      # Core: architecture rules, the Windows platform layer and the parsers
      # it feeds (process rows, foreground, where.exe), shells and hooks.
      - name: cargo test (core platform, parsers, shell, hooks)
        run: |
          cargo test -p pitwall-core --test boundaries
          cargo test -p pitwall-core --lib -- platform:: procs:: shell:: host:: hooks:: kind::catalog

      # Daemon server: handshake, methods and approvals over the named pipe.
      - name: cargo test (daemon)
        run: cargo test -p pitwall-daemon

      # ---- not yet ported: informational until their fixtures run on Windows.
      # TODO(windows): port the POSIX-shell fixtures, then move each suite up
      # into the required steps and delete its continue-on-error.

      # TODO(windows): the rest of core (engine, rules, onboarding, git,
      # review/worktrees) — fixtures write `#!/bin/sh` fake programs.
      - name: cargo test (core, rest) — not yet ported
        continue-on-error: true
        run: |
          cargo test -p pitwall-core --lib -- --skip platform:: --skip procs:: --skip shell:: --skip host:: --skip hooks:: --skip kind::catalog

      # TODO(windows): provider contract + fake agw (shell scripts).
      - name: cargo test (providers) — not yet ported
        continue-on-error: true
        run: cargo test -p pitwall-providers

      # The GPUI app (crates/pitwall-app): theme, window state, the engine
      # host and the event bridge. Informational until its first green run
      # on Windows (docs/spec/gpui/packaging.md "CI").
      - name: cargo test (pitwall-app) — not yet verified
        continue-on-error: true
        run: cargo test -p pitwall-app

      # TODO(windows): the CLI's tests.
      - name: cargo test (cli) — not yet ported
        continue-on-error: true
        run: cargo test -p pitwall-cli

  web:
    # The React UI is the website's live demo (src/README.md): type-check,
    # build and unit-test it, then build the site that embeds it.
    name: Web demo (build + test) and website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: Website build (with the live demo)
        working-directory: website
        run: |
          pnpm install --frozen-lockfile --ignore-workspace
          pnpm build --base /${{ github.event.repository.name }}/

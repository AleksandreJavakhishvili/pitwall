# Builds Pitwall (crates/pitwall-app, the native GPUI app) with
# scripts/package-app.sh: a universal macOS .app (Apple silicon + Intel) packed
# as a .dmg and an .app.tar.gz, a Linux x86_64 AppImage and .deb, and the
# Windows x64 installers (NSIS .exe and .msi); publishes them all in one release
# with one SHA256SUMS.txt (job `publish`).
#
#   git tag v0.2.0 && git push origin v0.2.0     → GitHub Release, notes from CHANGELOG.md
#                                                   (scripts/release.sh) or git-cliff
#   Actions → Release → Run workflow              → build only (artifacts on the run),
#                                                   or a release if you give a tag
#   a pull request that touches the packaging     → build only (artifacts on the run)
#
# Only `publish` can write (contents: write) and it runs only for a tag; the
# build jobs read. This workflow replaces release-gpui.yml (the GPUI app's
# artifact-only builds before the switch-over): one place builds the bundles,
# and pull requests that change packaging get the same build as a release.
#
# Release asset names (the website's download page matches on the suffixes):
#   Pitwall_<version>_universal.dmg        Pitwall_<version>_universal.app.tar.gz
#   Pitwall_<version>_amd64.AppImage       Pitwall_<version>_amd64.deb
#   Pitwall_<version>_x64-setup.exe        Pitwall_<version>_x64.msi    (Windows)
#   SHA256SUMS.txt
#
# macOS signing: without secrets the app is ad-hoc signed (users open it with
# right-click → Open the first time; see README "Install"). Add these repository
# secrets to switch to Developer ID signing + notarization + stapling (the
# script signs the sidecars, then the app, notarizes and staples the app and
# the .dmg):
#   APPLE_CERTIFICATE           base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD  password of that .p12
#   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID, APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID   for notarization
#
# Windows builds only when the repository variable RELEASE_WINDOWS is "true"
# (Settings → Secrets and variables → Actions → Variables); until the Windows
# port is verified on real machines, the release notes call it a preview.
#
# Windows: unsigned by default (SmartScreen warns on first run; see README
# "Windows"). For Authenticode signing add:
#   WINDOWS_CERTIFICATE           base64 of the code-signing .pfx
#   WINDOWS_CERTIFICATE_PASSWORD  password of that .pfx
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package-app.sh
      - crates/pitwall-app/packaging/**
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0). Empty = build only, no release."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A newer push to a pull request replaces its build; releases always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The released identity: "Pitwall", dev.pitwall.app, package `pitwall`.
  PITWALL_CHANNEL: stable
  # The packager pinned for Linux and Windows (MIT OR Apache-2.0).
  CARGO_PACKAGER_VERSION: 0.11.8

jobs:
  macos:
    runs-on: macos-latest
    # Release builds (two architectures, fat LTO) from a cold cache; a hang fails here.
    timeout-minutes: 120
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      mode: ${{ steps.signing.outputs.mode }}
    env:
      # Secrets can't be tested in `if:` directly; empty when not configured.
      SECRET_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      SECRET_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      SECRET_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
      SECRET_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      # Installs the version pinned in rust-toolchain.toml (+ both macOS targets).
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-universal

      - name: Version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          app_version=$(awk '/^\[/ { pkg = ($0 == "[package]") } pkg && /^version = / { gsub(/"/, "", $3); print $3; exit }' crates/pitwall-app/Cargo.toml)
          if [ "${GITHUB_REF_TYPE}" = tag ]; then tag="${GITHUB_REF_NAME}"; else tag="${INPUT_TAG}"; fi
          if [ -n "$tag" ] && [ "${tag#v}" != "$app_version" ]; then
            echo "::warning::tag $tag doesn't match crates/pitwall-app/Cargo.toml version $app_version"
          fi
          echo "app=$app_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Release bundles precompile GPUI's Metal shaders (gpui's build.rs runs
      # `xcrun metal` / `metallib`; no runtime-shaders feature). Xcode 16
      # includes the Metal toolchain; Xcode 26 ships it as a separate component.
      - name: Metal toolchain
        run: |
          xcodebuild -version
          if ! xcrun -sdk macosx metal -v >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal -v

      # Developer ID only with the certificate secrets: import it into a
      # temporary keychain; the script signs (and notarizes with the Apple ID
      # secrets). Otherwise the script signs ad-hoc.
      - name: Signing mode
        id: signing
        run: |
          if [ -n "$SECRET_CERTIFICATE" ] && [ -n "$SECRET_SIGNING_IDENTITY" ]; then
            kc="$RUNNER_TEMP/pitwall.keychain-db"
            pw=$(uuidgen)
            security create-keychain -p "$pw" "$kc"
            security set-keychain-settings -lut 21600 "$kc"
            security unlock-keychain -p "$pw" "$kc"
            printf '%s' "$SECRET_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -P "$SECRET_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
            rm -f "$RUNNER_TEMP/cert.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
            # shellcheck disable=SC2046 # the existing keychains, one word each
            security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
            echo "APPLE_SIGNING_IDENTITY=$SECRET_SIGNING_IDENTITY" >> "$GITHUB_ENV"
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
            if [ -n "$SECRET_APPLE_ID" ] && [ -n "$SECRET_APPLE_PASSWORD" ] && [ -n "$SECRET_APPLE_TEAM_ID" ]; then
              {
                echo "APPLE_ID=$SECRET_APPLE_ID"
                echo "APPLE_PASSWORD=$SECRET_APPLE_PASSWORD"
                echo "APPLE_TEAM_ID=$SECRET_APPLE_TEAM_ID"
              } >> "$GITHUB_ENV"
            fi
          else
            echo "mode=ad-hoc" >> "$GITHUB_OUTPUT"
          fi
          grep '^mode=' "$GITHUB_OUTPUT"

      - name: Build Pitwall.app and the .dmg (universal)
        run: scripts/package-app.sh --universal

      - name: Check the bundle
        run: |
          app=target/package/Pitwall.app
          plutil -p "$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = dev.pitwall.app
          for b in pitwall pitwall-hold pitwall-cli; do
            lipo -info "$app/Contents/MacOS/$b"
            lipo "$app/Contents/MacOS/$b" -verify_arch arm64 x86_64
          done
          codesign --verify --deep --strict --verbose=2 "$app"
          # Precompiled shaders: no Metal source embedded for runtime compiling.
          if grep -aq "using namespace metal;" "$app/Contents/MacOS/pitwall"; then
            echo "::error::pitwall was built with runtime shaders"; exit 1
          fi

      - name: Package and checksum
        id: pkg
        env:
          VERSION: ${{ steps.version.outputs.app }}
        run: |
          out=release-assets
          mkdir -p "$out"
          cp "target/package/Pitwall_${VERSION}_universal.dmg" "$out/"
          tar -C target/package -czf "$out/Pitwall_${VERSION}_universal.app.tar.gz" Pitwall.app
          (cd "$out" && shasum -a 256 -- *.dmg *.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: pitwall-macos-universal
          path: ${{ steps.pkg.outputs.dir }}/*
          if-no-files-found: error

      - name: Remove the keychain
        if: always() && steps.signing.outputs.mode == 'developer-id'
        run: security delete-keychain "$RUNNER_TEMP/pitwall.keychain-db" || true

  # Linux x86_64: an AppImage (runs on most distributions) and a .deb (package
  # `pitwall`, as before, so it upgrades the v0.1.x install). Built on the
  # oldest supported Ubuntu so the AppImage's glibc floor stays low.
  linux:
    runs-on: ubuntu-22.04
    # Release builds (fat LTO) from a cold cache; a hang fails here.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # GPUI's build and runtime libraries, plus what cargo-packager's
      # AppImage step (linuxdeploy) needs.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file pkg-config patchelf libfuse2 \
            clang libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan1 libvulkan-dev libzstd-dev libasound2-dev libglib2.0-dev libssl-dev

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux

      - name: Version
        id: version
        run: |
          app_version=$(awk '/^\[/ { pkg = ($0 == "[package]") } pkg && /^version = / { gsub(/"/, "", $3); print $3; exit }' crates/pitwall-app/Cargo.toml)
          echo "app=$app_version" >> "$GITHUB_OUTPUT"

      - name: cargo-packager
        run: cargo packager --version 2>/dev/null || cargo install cargo-packager --locked --version "$CARGO_PACKAGER_VERSION"

      - name: Build the AppImage and .deb
        run: scripts/package-app.sh

      - name: Check, package and checksum
        id: pkg
        env:
          VERSION: ${{ steps.version.outputs.app }}
        run: |
          out=release-assets
          mkdir -p "$out"
          appimage=$(find target/package -maxdepth 1 -name "*.AppImage" | head -1)
          deb=$(find target/package -maxdepth 1 -name "*.deb" | head -1)
          dpkg-deb -I "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = pitwall
          # The app and its sidecars ship in both.
          for b in pitwall pitwall-hold pitwall-cli; do
            dpkg-deb -c "$deb" | grep -E "usr/bin/$b\$"
          done
          (cd "$(mktemp -d)" && "$OLDPWD/$appimage" --appimage-extract >/dev/null \
            && for b in pitwall pitwall-hold pitwall-cli; do test -x "squashfs-root/usr/bin/$b"; done)
          # What the app links at run time (the .deb's Depends: should cover it).
          ldd target/package/bin/pitwall
          cp "$appimage" "$out/Pitwall_${VERSION}_amd64.AppImage"
          cp "$deb" "$out/Pitwall_${VERSION}_amd64.deb"
          chmod +x "$out"/*.AppImage
          (cd "$out" && sha256sum -- *.AppImage *.deb > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: pitwall-linux-x86_64
          path: ${{ steps.pkg.outputs.dir }}/*
          if-no-files-found: error

  # Windows x64 (preview): the NSIS installer (per user, no admin rights) and
  # an .msi, with pitwall-hold / pitwall-cli / pitwall-hook next to the app.
  windows:
    if: vars.RELEASE_WINDOWS == 'true'
    runs-on: windows-latest
    # Release builds (fat LTO, two installers) from a cold cache; a hang fails here.
    timeout-minutes: 120
    outputs:
      mode: ${{ steps.signing.outputs.mode }}
    env:
      SECRET_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      SECRET_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows

      - name: Version
        id: version
        run: |
          app_version=$(awk '/^\[/ { pkg = ($0 == "[package]") } pkg && /^version = / { gsub(/"/, "", $3); print $3; exit }' crates/pitwall-app/Cargo.toml)
          echo "app=$app_version" >> "$GITHUB_OUTPUT"

      # gpui's build.rs compiles its HLSL shaders with fxc.exe from the
      # Windows SDK (release builds); point it at the newest one installed.
      - name: fxc.exe (Windows SDK)
        run: |
          fxc=$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"10.*/x64/fxc.exe | sort -V | tail -1)
          test -n "$fxc"
          echo "GPUI_FXC_PATH=$(cygpath -w "$fxc")" >> "$GITHUB_ENV"

      - name: cargo-packager
        run: cargo packager --version 2>/dev/null || cargo install cargo-packager --locked --version "$CARGO_PACKAGER_VERSION"

      # Authenticode only when a certificate is configured: import it and
      # hand its thumbprint to the script (signtool for the sidecars,
      # cargo-packager for the app and the installers).
      - name: Signing mode
        id: signing
        shell: pwsh
        run: |
          if ($env:SECRET_WINDOWS_CERTIFICATE) {
            $pfx = Join-Path $env:RUNNER_TEMP "pitwall.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SECRET_WINDOWS_CERTIFICATE))
            $pw = ConvertTo-SecureString $env:SECRET_WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
            Remove-Item $pfx
            "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
            "mode=authenticode" >> $env:GITHUB_OUTPUT
          } else {
            "mode=unsigned" >> $env:GITHUB_OUTPUT
          }

      - name: Build the installers (NSIS + MSI)
        run: scripts/package-app.sh

      - name: Check, package and checksum
        id: pkg
        env:
          VERSION: ${{ steps.version.outputs.app }}
        run: |
          out=release-assets
          mkdir -p "$out"
          for b in pitwall pitwall-hold pitwall-cli pitwall-hook; do test -f "target/package/bin/$b.exe"; done
          cp "$(find target/package -maxdepth 1 -name "*-setup.exe" | head -1)" "$out/Pitwall_${VERSION}_x64-setup.exe"
          cp "$(find target/package -maxdepth 1 -name "*.msi" | head -1)" "$out/Pitwall_${VERSION}_x64.msi"
          (cd "$out" && sha256sum -- *.exe *.msi > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: pitwall-windows-x64
          path: ${{ steps.pkg.outputs.dir }}/*
          if-no-files-found: error

  # One release with every platform's downloads and one SHA256SUMS.txt: each
  # build's own checksums are verified, then one file covers every asset.
  publish:
    needs: [macos, linux, windows]
    # Only for a tag. Windows may be skipped (RELEASE_WINDOWS); macOS and
    # Linux must succeed.
    if: >-
      !cancelled() && github.event_name != 'pull_request' &&
      needs.macos.outputs.tag != '' &&
      needs.macos.result == 'success' && needs.linux.result == 'success' &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history and tags: the release notes cover the commits since the
      # previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # From the previous v* tag to this one; the first release starts at the
      # root commit.
      - name: Release notes range
        id: range
        env:
          TAG: ${{ needs.macos.outputs.tag }}
        run: |
          git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null || { echo "::error::tag $TAG not found"; exit 1; }
          if prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null); then
            from=$prev
          else
            from=$(git rev-list --max-parents=0 "$TAG" | tail -n 1)
          fi
          echo "range=$from..$TAG" >> "$GITHUB_OUTPUT"

      # The tag's section of CHANGELOG.md, which scripts/release.sh wrote and
      # committed before tagging (the git-cliff entries plus the hand-written
      # highlights).
      - name: Release notes (CHANGELOG.md)
        id: changelog
        env:
          TAG: ${{ needs.macos.outputs.tag }}
        run: |
          awk -v ver="${TAG#v}" '
            index($0, "## [" ver "]") == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }' CHANGELOG.md > release-notes.md
          if grep -q '[^[:space:]]' release-notes.md; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            rm release-notes.md
          fi

      # Tagged without scripts/release.sh: render the notes for the range with
      # cliff.toml, grouped by commit type; commits that don't follow the
      # convention are left out. Nothing is committed: they're only the body.
      - name: Release notes (git-cliff)
        if: steps.changelog.outputs.found != 'true'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --strip all ${{ steps.range.outputs.range }}
        env:
          OUTPUT: release-notes.md

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.macos.outputs.tag }}
          MODE: ${{ needs.macos.outputs.mode }}
          WINDOWS_MODE: ${{ needs.windows.outputs.mode }}
        run: |
          for dir in artifacts/*/; do (cd "$dir" && sha256sum -c SHA256SUMS.txt); done
          mkdir -p assets
          find artifacts -type f ! -name SHA256SUMS.txt -exec cp {} assets/ \;
          (cd assets && sha256sum -- * > ../SHA256SUMS.txt) && mv SHA256SUMS.txt assets/
          cat assets/SHA256SUMS.txt
          note="macOS: Apple silicon and Intel (universal). Linux: x86_64 AppImage and .deb."
          if [ -n "$WINDOWS_MODE" ]; then
            note="$note Windows (preview): x64 installer (.exe, per user) and .msi."
          else
            note="$note Windows builds come in a later release."
          fi
          if [ "$MODE" = ad-hoc ]; then
            note="$note The macOS build isn't notarized: open it the first time with right-click → Open, or run \`xattr -dr com.apple.quarantine /Applications/Pitwall.app\`."
          fi
          if [ "$WINDOWS_MODE" = unsigned ]; then
            note="$note The Windows installers aren't code-signed: SmartScreen asks on first run (More info → Run anyway)."
          fi
          {
            cat release-notes.md 2>/dev/null
            printf '\n### Downloads\n\n%s\n' "$note"
          } > notes.md
          flags=(--verify-tag --notes-file notes.md)
          # No conventional commits in the range (the history before the
          # convention): fall back to GitHub's generated notes.
          if ! grep -q '^- ' release-notes.md; then flags+=(--generate-notes); fi
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" "${flags[@]}" assets/*

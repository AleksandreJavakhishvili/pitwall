# Builds Pitwall.app as a universal macOS binary (Apple silicon + Intel), packs a
# .dmg and an .app.tar.gz; builds a Linux x86_64 AppImage and .deb and the
# Windows x64 installers (NSIS .exe and .msi); publishes them all in one
# release with one SHA256SUMS.txt (job `publish`).
#
#   git tag v0.1.0 && git push origin v0.1.0     → GitHub Release, notes from git-cliff (cliff.toml)
#   Actions → Release → Run workflow              → build only (artifacts on the run),
#                                                   or a release if you give a tag
#
# Signing: without secrets the app is ad-hoc signed (users open it with
# right-click → Open the first time; see README "Install"). Add these repository
# secrets to switch to Developer ID signing + notarization + stapling:
#   APPLE_CERTIFICATE           base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD  password of that .p12
#   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID, APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID   for notarization
#
# Windows: unsigned by default (SmartScreen warns on first run; see README
# "Windows"). For Authenticode signing add:
#   WINDOWS_CERTIFICATE           base64 of the code-signing .pfx
#   WINDOWS_CERTIFICATE_PASSWORD  password of that .pfx
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0). Empty = build only, no release."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TARGET: universal-apple-darwin

jobs:
  macos:
    runs-on: macos-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      mode: ${{ steps.signing.outputs.mode }}
    env:
      # Secrets can't be tested in `if:` directly; empty when not configured. They
      # get their real names (which Tauri reads) only in "Signing mode", and only
      # when set, so an empty APPLE_CERTIFICATE never reaches the bundler.
      SECRET_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      SECRET_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      SECRET_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
      SECRET_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Installs the version pinned in rust-toolchain.toml (+ its components/targets).
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-universal

      - run: pnpm install --frozen-lockfile

      - name: Version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          app_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_TYPE}" = tag ]; then tag="${GITHUB_REF_NAME}"; else tag="${INPUT_TAG}"; fi
          if [ -n "$tag" ] && [ "${tag#v}" != "$app_version" ]; then
            echo "::warning::tag $tag doesn't match tauri.conf.json version $app_version"
          fi
          echo "app=$app_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Tauri bundles each externalBin as binaries/<name>-<target triple>. For a
      # universal build that's <name>-universal-apple-darwin, which src-tauri/build.rs
      # doesn't make (it builds per architecture). Build both architectures into the
      # same target dir build.rs uses (so it finds them up to date) and lipo them.
      - name: Universal sidecars (pitwall-hold, pitwall-cli)
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target "$t" --target-dir target/hold \
              -p pitwall-hold --bin pitwall-hold -p pitwall-cli --bin pitwall-cli
          done
          for b in pitwall-hold pitwall-cli; do
            lipo -create -output "src-tauri/binaries/$b-universal-apple-darwin" \
              "target/hold/aarch64-apple-darwin/release/$b" "target/hold/x86_64-apple-darwin/release/$b"
            lipo -info "src-tauri/binaries/$b-universal-apple-darwin"
          done

      # Ad-hoc ("-") unless a Developer ID certificate is configured. Tauri reads
      # APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD (imports them into a temporary
      # keychain), APPLE_SIGNING_IDENTITY, and notarizes + staples the app when
      # APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID are set.
      - name: Signing mode
        id: signing
        run: |
          if [ -n "$SECRET_CERTIFICATE" ] && [ -n "$SECRET_SIGNING_IDENTITY" ]; then
            {
              echo "APPLE_CERTIFICATE=$SECRET_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$SECRET_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$SECRET_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
            if [ -n "$SECRET_APPLE_ID" ] && [ -n "$SECRET_APPLE_PASSWORD" ] && [ -n "$SECRET_APPLE_TEAM_ID" ]; then
              {
                echo "APPLE_ID=$SECRET_APPLE_ID"
                echo "APPLE_PASSWORD=$SECRET_APPLE_PASSWORD"
                echo "APPLE_TEAM_ID=$SECRET_APPLE_TEAM_ID"
              } >> "$GITHUB_ENV"
              echo "notarize=true" >> "$GITHUB_OUTPUT"
            else
              echo "notarize=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "mode=ad-hoc" >> "$GITHUB_OUTPUT"
            echo "notarize=false" >> "$GITHUB_OUTPUT"
          fi
          grep '^mode=\|^notarize=' "$GITHUB_OUTPUT"

      - name: Build Pitwall.app and .dmg
        run: pnpm tauri build --target "$TARGET" --bundles app,dmg

      # Tauri notarizes the .app; the .dmg around it is notarized and stapled here.
      - name: Notarize and staple the .dmg (only with Apple secrets)
        if: steps.signing.outputs.notarize == 'true'
        run: |
          dmg=$(find "target/$TARGET/release/bundle/dmg" -name "*.dmg" | head -1)
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"

      - name: Package and checksum
        id: pkg
        env:
          VERSION: ${{ steps.version.outputs.app }}
        run: |
          bundle="target/$TARGET/release/bundle"
          out=release-assets
          mkdir -p "$out"
          codesign --verify --deep --strict --verbose=2 "$bundle/macos/Pitwall.app"
          cp "$(find "$bundle/dmg" -name "*.dmg" | head -1)" "$out/Pitwall_${VERSION}_universal.dmg"
          tar -C "$bundle/macos" -czf "$out/Pitwall_${VERSION}_universal.app.tar.gz" Pitwall.app
          (cd "$out" && shasum -a 256 -- *.dmg *.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: pitwall-macos-universal
          path: ${{ steps.pkg.outputs.dir }}/*
          if-no-files-found: error

  # Linux x86_64: an AppImage (runs on most distributions) and a .deb. Built on
  # the oldest supported Ubuntu so the AppImage's glibc floor stays low.
  # src-tauri/build.rs builds the pitwall-hold / pitwall-cli sidecars for the
  # same target triple; Tauri puts them next to the app (/usr/bin in the .deb,
  # usr/bin inside the AppImage; the app copies them out of an AppImage's
  # mount before agents use them).
  linux:
    runs-on: ubuntu-22.04
    env:
      TARGET: x86_64-unknown-linux-gnu
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file pkg-config patchelf libfuse2 \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Installs the version pinned in rust-toolchain.toml (+ its components/targets).
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux

      - run: pnpm install --frozen-lockfile

      - name: Version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          app_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_TYPE}" = tag ]; then tag="${GITHUB_REF_NAME}"; else tag="${INPUT_TAG}"; fi
          echo "app=$app_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build the AppImage and .deb
        run: pnpm tauri build --target "$TARGET" --bundles appimage,deb

      - name: Package and checksum
        id: pkg
        env:
          VERSION: ${{ steps.version.outputs.app }}
        run: |
          bundle="target/$TARGET/release/bundle"
          out=release-assets
          mkdir -p "$out"
          appimage=$(find "$bundle/appimage" -name "*.AppImage" | head -1)
          deb=$(find "$bundle/deb" -name "*.deb" | head -1)
          # The sidecars must ship in both.
          dpkg-deb -c "$deb" | grep -E 'usr/bin/pitwall-hold$'
          dpkg-deb -c "$deb" | grep -E 'usr/bin/pitwall-cli$'
          (cd "$(mktemp -d)" && "$OLDPWD/$appimage" --appimage-extract >/dev/null && test -x squashfs-root/usr/bin/pitwall-hold && test -x squashfs-root/usr/bin/pitwall-cli)
          cp "$appimage" "$out/Pitwall_${VERSION}_amd64.AppImage"
          cp "$deb" "$out/Pitwall_${VERSION}_amd64.deb"
          chmod +x "$out"/*.AppImage
          (cd "$out" && sha256sum -- *.AppImage *.deb > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: pitwall-linux-x86_64
          path: ${{ steps.pkg.outputs.dir }}/*
          if-no-files-found: error

  # Windows x64: the NSIS installer (per user, no admin rights) and an .msi.
  # src-tauri/build.rs builds the pitwall-hold / pitwall-cli / pitwall-hook
  # sidecars (tauri.windows.conf.json ships all three next to the app).
  windows:
    runs-on: windows-latest
    outputs:
      mode: ${{ steps.signing.outputs.mode }}
    env:
      SECRET_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      SECRET_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Installs the version pinned in rust-toolchain.toml (+ its components/targets).
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows

      - run: pnpm install --frozen-lockfile

      - name: Version
        id: version
        run: |
          app_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "app=$app_version" >> "$GITHUB_OUTPUT"

      # Authenticode only when a certificate is configured: import it and
      # hand its thumbprint to Tauri, which signs the app and the installers.
      - name: Signing mode
        id: signing
        shell: pwsh
        run: |
          if ($env:SECRET_WINDOWS_CERTIFICATE) {
            $pfx = Join-Path $env:RUNNER_TEMP "pitwall.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SECRET_WINDOWS_CERTIFICATE))
            $pw = ConvertTo-SecureString $env:SECRET_WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
            Remove-Item $pfx
            $config = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = "sha256"; timestampUrl = "http://timestamp.digicert.com" } } } | ConvertTo-Json -Compress -Depth 5
            Set-Content -Path (Join-Path $env:RUNNER_TEMP "sign.json") -Value $config
            "mode=authenticode" >> $env:GITHUB_OUTPUT
          } else {
            "mode=unsigned" >> $env:GITHUB_OUTPUT
          }

      - name: Build the installers (NSIS + MSI)
        env:
          MODE: ${{ steps.signing.outputs.mode }}
        run: |
          flags=(--bundles "nsis,msi")
          if [ "$MODE" = authenticode ]; then flags+=(--config "$RUNNER_TEMP/sign.json"); fi
          pnpm tauri build "${flags[@]}"

      - name: Package and checksum
        id: pkg
        env:
          VERSION: ${{ steps.version.outputs.app }}
        run: |
          bundle=target/release/bundle
          out=release-assets
          mkdir -p "$out"
          cp "$(find "$bundle/nsis" -name "*.exe" | head -1)" "$out/Pitwall_${VERSION}_x64-setup.exe"
          cp "$(find "$bundle/msi" -name "*.msi" | head -1)" "$out/Pitwall_${VERSION}_x64.msi"
          (cd "$out" && sha256sum -- *.exe *.msi > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: pitwall-windows-x64
          path: ${{ steps.pkg.outputs.dir }}/*
          if-no-files-found: error

  # One release with every platform's downloads and one SHA256SUMS.txt: each
  # build's own checksums are verified, then one file covers every asset.
  publish:
    needs: [macos, linux, windows]
    if: needs.macos.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the release notes cover the commits since the
      # previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # From the previous v* tag to this one; the first release starts at the
      # root commit.
      - name: Release notes range
        id: range
        env:
          TAG: ${{ needs.macos.outputs.tag }}
        run: |
          git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null || { echo "::error::tag $TAG not found"; exit 1; }
          if prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null); then
            from=$prev
          else
            from=$(git rev-list --max-parents=0 "$TAG" | tail -n 1)
          fi
          echo "range=$from..$TAG" >> "$GITHUB_OUTPUT"

      # The tag's section of CHANGELOG.md, which scripts/release.sh wrote and
      # committed before tagging (the git-cliff entries plus the hand-written
      # highlights).
      - name: Release notes (CHANGELOG.md)
        id: changelog
        env:
          TAG: ${{ needs.macos.outputs.tag }}
        run: |
          awk -v ver="${TAG#v}" '
            index($0, "## [" ver "]") == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }' CHANGELOG.md > release-notes.md
          if grep -q '[^[:space:]]' release-notes.md; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            rm release-notes.md
          fi

      # Tagged without scripts/release.sh: render the notes for the range with
      # cliff.toml, grouped by commit type; commits that don't follow the
      # convention are left out. Nothing is committed: they're only the body.
      - name: Release notes (git-cliff)
        if: steps.changelog.outputs.found != 'true'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --strip all ${{ steps.range.outputs.range }}
        env:
          OUTPUT: release-notes.md

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.macos.outputs.tag }}
          MODE: ${{ needs.macos.outputs.mode }}
          WINDOWS_MODE: ${{ needs.windows.outputs.mode }}
        run: |
          for dir in artifacts/*/; do (cd "$dir" && sha256sum -c SHA256SUMS.txt); done
          mkdir -p assets
          find artifacts -type f ! -name SHA256SUMS.txt -exec cp {} assets/ \;
          (cd assets && sha256sum -- * > ../SHA256SUMS.txt) && mv SHA256SUMS.txt assets/
          cat assets/SHA256SUMS.txt
          note="macOS: Apple silicon and Intel (universal). Linux: x86_64 AppImage and .deb. Windows: x64 installer (.exe, per user) and .msi."
          if [ "$MODE" = ad-hoc ]; then
            note="$note The macOS build isn't notarized: open it the first time with right-click → Open, or run \`xattr -dr com.apple.quarantine /Applications/Pitwall.app\`."
          fi
          if [ "$WINDOWS_MODE" = unsigned ]; then
            note="$note The Windows installers aren't code-signed: SmartScreen asks on first run (More info → Run anyway)."
          fi
          {
            cat release-notes.md 2>/dev/null
            printf '\n### Downloads\n\n%s\n' "$note"
          } > notes.md
          flags=(--verify-tag --notes-file notes.md)
          # No conventional commits in the range (the history before the
          # convention): fall back to GitHub's generated notes.
          if ! grep -q '^- ' release-notes.md; then flags+=(--generate-notes); fi
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" "${flags[@]}" assets/*

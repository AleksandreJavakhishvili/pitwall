# Builds the GPUI app (crates/pitwall-app) into the same formats release.yml
# ships for the Tauri app: a universal macOS .app + .dmg, a Linux x86_64
# AppImage + .deb, Windows x64 NSIS .exe + .msi. Everything goes through
# scripts/package-app.sh (docs/spec/gpui/packaging.md).
#
# Workflow artifacts ONLY: this workflow never creates a GitHub release or a
# tag (its token can't: `contents: read`). release.yml keeps shipping the
# Tauri app until the switch-over (phase 9), when these jobs replace its
# build jobs and its `publish` job takes their artifacts.
#
#   Actions → Release (GPUI app) → Run workflow
#   or a push that touches the packaging files (paths below)
#
# Builds are the "preview" channel ("Pitwall Preview", dev.pitwall.app.preview)
# so they install next to the Tauri app.
#
# Signing hooks (all optional, same secrets as release.yml; unsigned/ad-hoc
# without them):
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY   Developer ID
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID                                 notarization
#   WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD                       Authenticode
name: Release (GPUI app)

on:
  workflow_dispatch:
  push:
    branches: ["gpui/**"]
    paths:
      - .github/workflows/release-gpui.yml
      - scripts/package-app.sh
      - crates/pitwall-app/packaging/**

permissions:
  contents: read

concurrency:
  group: release-gpui-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PITWALL_CHANNEL: preview
  # The packager pinned for Linux and Windows (MIT OR Apache-2.0).
  CARGO_PACKAGER_VERSION: 0.11.8

jobs:
  macos:
    runs-on: macos-latest
    # Release builds (two architectures, fat LTO) from a cold cache; a hang fails here.
    timeout-minutes: 120
    env:
      SECRET_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      SECRET_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      SECRET_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
      SECRET_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      # Installs the version pinned in rust-toolchain.toml (+ both macOS targets).
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-gpui-universal

      # Release bundles precompile GPUI's Metal shaders (gpui's build.rs runs
      # `xcrun metal` / `metallib`). Xcode 16 includes the Metal toolchain;
      # Xcode 26 ships it as a separate component.
      - name: Metal toolchain
        run: |
          xcodebuild -version
          if ! xcrun -sdk macosx metal -v >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal -v

      # Developer ID only with the certificate secrets: import it into a
      # temporary keychain; the script signs (and notarizes with the Apple ID
      # secrets). Otherwise the script signs ad-hoc.
      - name: Signing mode
        id: signing
        run: |
          if [ -n "$SECRET_CERTIFICATE" ] && [ -n "$SECRET_SIGNING_IDENTITY" ]; then
            kc="$RUNNER_TEMP/pitwall.keychain-db"
            pw=$(uuidgen)
            security create-keychain -p "$pw" "$kc"
            security set-keychain-settings -lut 21600 "$kc"
            security unlock-keychain -p "$pw" "$kc"
            printf '%s' "$SECRET_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -P "$SECRET_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
            rm -f "$RUNNER_TEMP/cert.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
            # shellcheck disable=SC2046 # the existing keychains, one word each
            security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
            echo "APPLE_SIGNING_IDENTITY=$SECRET_SIGNING_IDENTITY" >> "$GITHUB_ENV"
            if [ -n "$SECRET_APPLE_ID" ] && [ -n "$SECRET_APPLE_PASSWORD" ] && [ -n "$SECRET_APPLE_TEAM_ID" ]; then
              {
                echo "APPLE_ID=$SECRET_APPLE_ID"
                echo "APPLE_PASSWORD=$SECRET_APPLE_PASSWORD"
                echo "APPLE_TEAM_ID=$SECRET_APPLE_TEAM_ID"
              } >> "$GITHUB_ENV"
            fi
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
          else
            echo "mode=ad-hoc" >> "$GITHUB_OUTPUT"
          fi
          grep '^mode=' "$GITHUB_OUTPUT"

      - name: Build the .app and .dmg (universal)
        run: scripts/package-app.sh --universal

      - name: Check the bundle
        run: |
          app="target/package/Pitwall Preview.app"
          plutil -p "$app/Contents/Info.plist"
          for b in pitwall-app pitwall-hold pitwall-cli; do
            lipo -info "$app/Contents/MacOS/$b"
            lipo "$app/Contents/MacOS/$b" -verify_arch arm64 x86_64
          done
          codesign --verify --deep --strict --verbose=2 "$app"
          # Precompiled shaders: no Metal source embedded for runtime compiling.
          if grep -aq "using namespace metal;" "$app/Contents/MacOS/pitwall-app"; then
            echo "::error::pitwall-app was built with runtime shaders"; exit 1
          fi

      - name: Package and checksum
        id: pkg
        run: |
          out=release-assets
          mkdir -p "$out"
          cp target/package/*.dmg "$out/"
          dmg=$(basename "$out"/*.dmg .dmg)
          tar -C target/package -czf "$out/${dmg}.app.tar.gz" "Pitwall Preview.app"
          (cd "$out" && shasum -a 256 -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: pitwall-app-macos-universal
          path: ${{ steps.pkg.outputs.dir }}/*
          if-no-files-found: error

      - name: Remove the keychain
        if: always() && steps.signing.outputs.mode == 'developer-id'
        run: security delete-keychain "$RUNNER_TEMP/pitwall.keychain-db" || true

  # Built on the oldest supported Ubuntu so the AppImage's glibc floor stays low.
  linux:
    runs-on: ubuntu-22.04
    # Release builds (fat LTO) from a cold cache; a hang fails here.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # GPUI's build and runtime libraries (no WebKitGTK), plus what
      # cargo-packager's AppImage step (linuxdeploy) needs.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file pkg-config patchelf libfuse2 \
            clang libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan1 libvulkan-dev libzstd-dev libasound2-dev libglib2.0-dev libssl-dev

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-gpui-linux

      - name: cargo-packager
        run: cargo packager --version 2>/dev/null || cargo install cargo-packager --locked --version "$CARGO_PACKAGER_VERSION"

      - name: Build the AppImage and .deb
        run: scripts/package-app.sh

      - name: Check and checksum
        id: pkg
        run: |
          out=release-assets
          mkdir -p "$out"
          appimage=$(find target/package -maxdepth 1 -name "*.AppImage" | head -1)
          deb=$(find target/package -maxdepth 1 -name "*.deb" | head -1)
          dpkg-deb -I "$deb"
          for b in pitwall-app pitwall-hold pitwall-cli; do
            dpkg-deb -c "$deb" | grep -E "usr/bin/$b\$"
          done
          (cd "$(mktemp -d)" && "$OLDPWD/$appimage" --appimage-extract >/dev/null \
            && for b in pitwall-app pitwall-hold pitwall-cli; do test -x "squashfs-root/usr/bin/$b"; done)
          # What the app links at run time (the .deb's Depends: should cover it).
          ldd target/package/bin/pitwall-app
          cp "$appimage" "$deb" "$out/"
          chmod +x "$out"/*.AppImage
          (cd "$out" && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: pitwall-app-linux-x86_64
          path: ${{ steps.pkg.outputs.dir }}/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    # Release builds (fat LTO, two installers) from a cold cache; a hang fails here.
    timeout-minutes: 120
    env:
      SECRET_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      SECRET_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-gpui-windows

      # gpui's build.rs compiles its HLSL shaders with fxc.exe from the
      # Windows SDK; point it at the newest one installed.
      - name: fxc.exe (Windows SDK)
        run: |
          fxc=$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"10.*/x64/fxc.exe | sort -V | tail -1)
          test -n "$fxc"
          echo "GPUI_FXC_PATH=$(cygpath -w "$fxc")" >> "$GITHUB_ENV"

      - name: cargo-packager
        run: cargo packager --version 2>/dev/null || cargo install cargo-packager --locked --version "$CARGO_PACKAGER_VERSION"

      # Authenticode only when a certificate is configured: import it and
      # hand its thumbprint to the script (signtool for the sidecars,
      # cargo-packager for the app and the installers).
      - name: Signing mode
        id: signing
        shell: pwsh
        run: |
          if ($env:SECRET_WINDOWS_CERTIFICATE) {
            $pfx = Join-Path $env:RUNNER_TEMP "pitwall.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SECRET_WINDOWS_CERTIFICATE))
            $pw = ConvertTo-SecureString $env:SECRET_WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
            Remove-Item $pfx
            "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
            "mode=authenticode" >> $env:GITHUB_OUTPUT
          } else {
            "mode=unsigned" >> $env:GITHUB_OUTPUT
          }

      - name: Build the installers (NSIS + MSI)
        run: scripts/package-app.sh

      - name: Check and checksum
        id: pkg
        run: |
          out=release-assets
          mkdir -p "$out"
          for b in pitwall-app pitwall-hold pitwall-cli pitwall-hook; do test -f "target/package/bin/$b.exe"; done
          find target/package -maxdepth 1 \( -name "*.exe" -o -name "*.msi" \) -exec cp {} "$out/" \;
          ls "$out"/*-setup.exe "$out"/*.msi
          (cd "$out" && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: pitwall-app-windows-x64
          path: ${{ steps.pkg.outputs.dir }}/*
          if-no-files-found: error
